name: Smoke test (servidor real)
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Preparar servidor
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "level-seed=12345\nview-distance=4\nsimulation-distance=4\nonline-mode=false\nspawn-protection=0\n" > run/server.properties
      - name: Correr servidor con la prueba de humo
        shell: bash
        env:
          BLOODMOON_SMOKETEST: "1"
        run: |
          timeout 1200 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          grep -E "SMOKETEST (village|human)" server.log | sed 's/.*SMOKETEST //' | paste -sd'|' | sed 's/^/::notice::HUMANIDAD /' || true
          grep -E "SMOKETEST" server.log | grep -vE "SMOKETEST (village|human)" | tail -8 | sed 's/^/::notice::/' || true
          grep -E "Exception|ERROR\]|Error loading|Failed to" server.log | grep -v "SMOKETEST" | head -40 | sed 's/^/::warning::/' || true
          grep -q "SMOKETEST PASS" server.log || { tail -60 server.log | sed 's/^/::error::/'; exit 1; }
      - name: Publicar capturas en la rama smoke-maps
        if: always()
        shell: bash
        run: |
          ls run/smoke/*.png >/dev/null 2>&1 || exit 0
          mkdir /tmp/maps && cp run/smoke/*.png /tmp/maps/ && cd /tmp/maps
          git init -q && git checkout -q -b smoke-maps
          git config user.name "smoke-bot" && git config user.email "smoke-bot@users.noreply.github.com"
          git add . && git commit -q -m "maps ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" smoke-maps
